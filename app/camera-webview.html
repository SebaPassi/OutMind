<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>OutMind Camera</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #camera-preview {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #status-indicator {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.9);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #333;
      z-index: 1000;
    }
    #status-text {
      color: #22c55e;
    }
    #status-text.speaking {
      color: #ef4444;
    }
    #status-text.processing {
      color: #3b82f6;
    }
    canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div id="camera-preview"></div>
  <div id="status-indicator">
    Estado: <span id="status-text" class="waiting">Esperando...</span>
  </div>

  <!-- Protobject Framework -->
  <script src="https://app.protobject.com/framework/p.js"></script>
  
  <script>
    // Estado de la aplicación
    let isSpeaking = false;
    let lastProcessedAruco = null;
    let lastProcessedTime = 0;
    const THROTTLE_TIME = 3000; // 3 segundos entre detecciones del mismo ArUco

    // Inicializar ArUco detection
    Protobject.Aruco.start(200, 0);

    // Función para enviar mensaje a React Native
    function sendToReactNative(message) {
      if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage(JSON.stringify(message));
      } else {
        console.log('Message to React Native:', message);
      }
    }

    // Función para reproducir mensaje con TTS
    function sayMessage(message) {
      if (isSpeaking) {
        console.log('Already speaking, skipping...');
        return;
      }

      isSpeaking = true;
      updateStatus('Hablando...', 'speaking');

      // Reproducir con Protobject TTS
      Protobject.TextToSpeech.play('es', message);

      // Calcular duración aproximada (13 caracteres por segundo)
      const duration = Math.max(3000, (message.length / 13) * 1000);
      
      setTimeout(() => {
        isSpeaking = false;
        updateStatus('Esperando...', 'waiting');
      }, duration);
    }

    // Función para actualizar el estado visual
    function updateStatus(text, className = 'waiting') {
      const statusText = document.getElementById('status-text');
      statusText.textContent = text;
      statusText.className = className;
    }

    // Escuchar detecciones de ArUco
    Protobject.Aruco.onData((data) => {
      // Ignorar si está hablando
      if (isSpeaking) return;

      // Procesar cada ArUco detectado
      Object.keys(data).forEach(arucoId => {
        const arucoIdNum = parseInt(arucoId);
        const now = Date.now();

        // Throttling: evitar procesar el mismo ArUco muy seguido
        if (lastProcessedAruco === arucoIdNum && (now - lastProcessedTime) < THROTTLE_TIME) {
          return;
        }

        // Marcar como procesado
        lastProcessedAruco = arucoIdNum;
        lastProcessedTime = now;

        // Enviar detección a React Native
        updateStatus('Procesando...', 'processing');
        sendToReactNative({
          type: 'ARUCO_DETECTED',
          arucoId: arucoIdNum
        });
      });
    });

    // Escuchar mensajes desde React Native
    window.addEventListener('message', (event) => {
      try {
        const message = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
        
        if (message.type === 'SPEAK_MESSAGE') {
          sayMessage(message.text);
        } else if (message.type === 'UPDATE_STATUS') {
          updateStatus(message.text, message.statusClass || 'waiting');
        }
      } catch (error) {
        console.error('Error parsing message from React Native:', error);
      }
    });

    // Mostrar preview de la cámara
    Protobject.Aruco.showPreview({
      width: window.innerWidth,
      height: window.innerHeight,
      elementId: 'camera-preview'
    });

    // Asegurar que el canvas se mantenga dentro del contenedor
    setTimeout(() => {
      const canvas = document.querySelector('canvas');
      const container = document.getElementById('camera-preview');
      if (canvas && container && !container.contains(canvas)) {
        container.appendChild(canvas);
        canvas.style.position = 'relative';
        canvas.style.top = '0';
        canvas.style.left = '0';
        canvas.style.width = '100%';
        canvas.style.height = '100%';
      }
    }, 500);

    // Notificar a React Native que el WebView está listo
    setTimeout(() => {
      sendToReactNative({
        type: 'WEBVIEW_READY'
      });
    }, 1000);
  </script>
</body>
</html>
